<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="17" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
        <path d="m9 15 2 2 4-4"/>
      </svg>
      <span>Smart Attendance Tracker</span>
    </div>
    <p class="tagline">Track subjects, mark attendance, stay above 75%</p>
  </header>

  <!-- Add subject -->
  <section class="card">
    <h2 class="card-title">Add a Subject</h2>
    <div class="add-subject-row">
      <input type="text" id="subjectName" placeholder="e.g. Data Structures">
      <button id="addSubjectBtn" class="btn-primary">Add</button>
    </div>
  </section>

  <!-- Subject list -->
  <section id="subjectList" class="subject-list">
    <!-- Subject cards injected by JS -->
  </section>

  <p id="emptyState" class="empty-state">No subjects added yet. Add one above to get started.</p>

  <footer class="app-footer">
    <p>Built with HTML, CSS &amp; vanilla JavaScript · Data saved locally in your browser</p>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
